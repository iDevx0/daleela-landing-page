<title>Daleela</title>
<meta name="description" content="Your doctor takes care of you. Browse the Daleela website, watch the Daleela Care demo, or download the Daleela app.">

<style>
:root{
  --ink:#1A1A1C; --text:#404040; --muted:#737373;
  --bg:#FAFAFA; --line:rgba(212,212,212,.5); --line-2:rgba(26,26,28,.09);
  --sky:#E4ECF4; --sky-2:#D6E2EE; --teal:#2D7887; --teal-soft:#E5F4F8;
  --pink:#D6265F; --pink-dark:#B22851; --pink-soft:#FFECEE;
  --ease:cubic-bezier(.22,.61,.36,1);
  --display:"Bricolage Grotesque",Manrope,Vazirmatn,ui-sans-serif,system-ui,sans-serif;
  --sans:Manrope,Vazirmatn,ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-weight:500;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:16px}
.wrap{position:relative;max-width:1180px;margin:0 auto;padding:0 24px}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--sky-2) 0%,var(--sky) 55%,var(--bg) 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}
.glow.g1{width:520px;height:520px;background:#F3F7FB;top:-220px;right:-80px;opacity:.9;animation:drift 24s var(--ease) infinite alternate}
.glow.g2{width:380px;height:380px;background:#D3ECF1;bottom:40px;left:-160px;opacity:.7;animation:drift 30s var(--ease) infinite alternate-reverse}
@keyframes drift{to{transform:translate(-50px,40px) scale(1.08)}}

header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
.logo{display:inline-flex;align-items:center;width:122px;min-height:44px}
.logo svg{width:100%;height:auto}

.hero-copy{text-align:center;padding:72px 0 64px}
h1{margin:0 auto;font-family:var(--display);font-weight:700;font-size:72px;line-height:1.05;letter-spacing:-.025em;color:var(--ink);max-width:820px;text-wrap:balance}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch;padding-bottom:104px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:32px;border-radius:32px;background:#fff;border:1px solid var(--line);box-shadow:0 1px 2px rgba(26,26,28,.03),0 18px 40px -24px rgba(26,26,28,.18);transition:transform .4s var(--ease),box-shadow .4s var(--ease)}
.card:hover{transform:translateY(-6px);box-shadow:0 1px 2px rgba(26,26,28,.03),0 30px 60px -28px rgba(26,26,28,.28)}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.015em;color:var(--ink)}
.card p{margin:0;font-size:16px;line-height:1.6;color:var(--muted)}
.icon{width:56px;height:56px;border-radius:18px;background:var(--teal-soft);display:inline-flex;align-items:center;justify-content:center;margin-bottom:6px;transition:transform .4s var(--ease)}
.card:hover .icon{transform:rotate(-6deg) scale(1.06)}
.bottom{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:10px}

.card.featured{background:var(--ink);border-color:var(--ink);box-shadow:0 30px 60px -28px rgba(26,26,28,.55)}
.card.featured h2{color:#fff}
.card.featured p{color:rgba(255,255,255,.72)}
.card.featured .icon{background:rgba(255,255,255,.1)}
.card.featured .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;background:var(--pink-soft);color:var(--pink-dark);font-size:12.5px;font-weight:700}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--pink)}

/* buttons: pill + pink chevron circle */
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:14px;min-height:52px;padding:4px 4px 4px 22px;border-radius:999px;font-size:15px;font-weight:700;letter-spacing:-.01em;transition:transform .25s var(--ease),background-color .25s var(--ease)}
.btn .arrow{width:44px;height:44px;border-radius:50%;background:var(--pink);display:inline-flex;align-items:center;justify-content:center;transition:transform .35s var(--ease),background-color .25s var(--ease)}
.btn:hover .arrow{transform:translateX(4px)}
.btn:active{transform:scale(.98)}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.light{background:#fff;color:var(--ink)}
.btn.light:hover{background:#F0F0F0}

.store{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 18px;border-radius:18px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.75),0 0 0 1px var(--line-2);transition:transform .25s var(--ease),box-shadow .25s var(--ease),background-color .25s var(--ease)}
.store:hover{background:#fff;transform:translateY(-2px);box-shadow:inset 0 0 0 1px #fff,0 0 0 1px rgba(26,26,28,.14),0 12px 24px -14px rgba(26,26,28,.3)}
.store span{display:flex;flex-direction:column;line-height:1.2}
.store small{font-size:12px;color:var(--muted)}
.store b{font-size:16px;font-weight:700;color:var(--ink)}

/* ---------- footer ---------- */
footer{background:#fff;border-top:1px solid #E5E5E5}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:30px 24px}
.socials{display:flex;gap:8px}
.dl-social{width:44px;height:44px;border-radius:50%;background:#F0F0F0;display:inline-flex;align-items:center;justify-content:center;transition:transform .25s var(--ease),background-color .25s var(--ease)}
.dl-social:hover{transform:translateY(-3px);background:var(--sky)}
.legal{display:flex;flex-wrap:wrap;gap:20px;font-size:14px;color:var(--muted)}
.legal a:hover{color:var(--ink)}

/* ---------- video modal ---------- */
button.btn{border:0;cursor:pointer;font-family:inherit;width:100%}
.vmodal{padding:0;border:0;background:transparent;max-width:min(960px,92vw);width:100%;overflow:visible}
.vmodal::backdrop{background:rgba(26,26,28,.72);backdrop-filter:blur(6px)}
.vmodal[open]{animation:pop .35s var(--ease)}
.vmodal[open]::backdrop{animation:fade .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.vframe{position:relative;border-radius:28px;overflow:hidden;background:#000;box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.vframe video{display:block;width:100%;max-height:82vh;background:#000}
.vclose{position:absolute;top:-52px;right:0;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .25s var(--ease)}
.vclose:hover{transform:rotate(90deg)}
@media (max-width:640px){.vframe{border-radius:20px}}

/* ---------- entrance ---------- */
.rise{opacity:0;transform:translateY(20px);animation:rise .9s var(--ease) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.32s}.d4{animation-delay:.44s}.d5{animation-delay:.56s}
@keyframes rise{to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:980px){
  h1{font-size:60px}
  .cards{grid-template-columns:1fr 1fr}
  .card.featured{grid-column:1 / -1;order:-1}
}
@media (max-width:640px){
  .hero-copy{padding:40px 0 40px}
  h1{font-size:44px}
  .cards{grid-template-columns:1fr;padding-bottom:64px}
  .card{padding:26px;border-radius:28px}
  .foot{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .rise{opacity:1;transform:none}
}
</style>
</head>
